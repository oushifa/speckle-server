enum ApprovalFlowResourceType {
  MODEL
  FORMS
}

enum ApprovalFlowStatus {
  PENDING
  APPROVED
  REJECTED
  CANCELED
}

enum ApprovalFlowActionType {
  STARTED
  STEP_APPROVED
  APPROVED
  REJECTED
  CANCELED
  TIMEOUT_REJECTED
}

enum ApprovalFlowStepStatus {
  WAITING
  PENDING
  APPROVED
  REJECTED
  CANCELED
}

enum ApprovalFlowInstanceListScope {
  ALL
  TODO
  INITIATED
  HANDLED
}

type ApprovalFlowDefinition {
  id: ID!
  templateId: ID!
  name: String!
  resourceType: ApprovalFlowResourceType!
  isActive: Boolean!
  version: Int!
  previousVersionId: ID
  effectConfig: JSONObject
  formSchema: [ApprovalFlowFormField!]!
  createdBy: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
  steps: [ApprovalFlowDefinitionStep!]!
}

type ApprovalFlowAction {
  id: ID!
  instanceId: ID!
  stepId: ID
  action: ApprovalFlowActionType!
  fromStatus: ApprovalFlowStatus
  toStatus: ApprovalFlowStatus
  comment: String
  metadata: JSONObject
  actorId: ID!
  actor: LimitedUser
  createdAt: DateTime!
}

type ApprovalFlowDefinitionStep {
  id: ID!
  definitionId: ID!
  name: String!
  stepIndex: Int!
  approverIds: [ID!]!
  requiredApprovals: Int!
  timeoutHours: Int
  createdAt: DateTime!
}

type ApprovalFlowInstanceStep {
  id: ID!
  instanceId: ID!
  definitionStepId: ID
  name: String!
  stepIndex: Int!
  status: ApprovalFlowStepStatus!
  approverIds: [ID!]!
  approvers: [LimitedUser]!
  requiredApprovals: Int!
  approvedByIds: [ID!]!
  approvedBy: [LimitedUser]!
  stepSnapshot: JSONObject
  startedAt: DateTime
  dueAt: DateTime
  completedAt: DateTime
  createdAt: DateTime!
}

type ApprovalFlowInstance {
  id: ID!
  definitionId: ID
  templateId: ID!
  definitionVersion: Int
  projectId: ID
  project: Project
  definition: ApprovalFlowDefinition
  resourceType: ApprovalFlowResourceType!
  resourceId: ID
  model: Model
  formData: JSONObject
  flowSnapshot: JSONObject
  status: ApprovalFlowStatus!
  currentStep: Int!
  createdBy: ID!
  createdByUser: LimitedUser
  createdAt: DateTime!
  updatedAt: DateTime!
  actions: [ApprovalFlowAction!]!
  steps: [ApprovalFlowInstanceStep!]!
}

type ApprovalFlowFormField {
  key: String!
  name: String!
  type: String!
  required: Boolean!
  placeholder: String
  options: [ApprovalFlowFormFieldOption!]!
}

type ApprovalFlowFormFieldOption {
  label: String!
  value: String!
}

type ApprovalFlowStats {
  totalCount: Int!
  pendingCount: Int!
  approvedCount: Int!
  rejectedCount: Int!
  canceledCount: Int!
  initiatedCount: Int!
  handledCount: Int!
  pendingForMeCount: Int!
  averageResolutionHours: Float!
}

type ApprovalFlowInstanceCollection {
  totalCount: Int!
  cursor: String
  items: [ApprovalFlowInstance!]!
}

type ApprovalFlowTodoCountUpdatedMessage {
  pendingForMeCount: Int!
}

input CreateApprovalFlowDefinitionInput {
  id: ID
  templateId: ID
  name: String!
  resourceType: ApprovalFlowResourceType
  isActive: Boolean
  previousVersionId: ID
  effectConfig: JSONObject
  steps: [ApprovalFlowDefinitionStepInput!]
  formSchema: [ApprovalFlowFormFieldInput!]
}

input ApprovalFlowDefinitionStepInput {
  name: String!
  approverIds: [ID!]
  requiredApprovals: Int
  timeoutHours: Int
}

input ApprovalFlowFormFieldInput {
  key: String!
  name: String!
  type: String!
  required: Boolean
  placeholder: String
  options: [ApprovalFlowFormFieldOptionInput!]
}

input ApprovalFlowFormFieldOptionInput {
  label: String!
  value: String!
}

input StartApprovalFlowInput {
  templateId: ID
  definitionId: ID
  projectId: ID
  resourceId: ID
  formData: JSONObject
}

input ApproveApprovalFlowInput {
  instanceId: ID!
  comment: String
  nextStepApproverIds: [ID!]
}

input RejectApprovalFlowInput {
  instanceId: ID!
  comment: String!
  rollbackToStep: Int
}

input CancelApprovalFlowInput {
  instanceId: ID!
  comment: String
}

type ApprovalMutations {
  createDefinition(input: CreateApprovalFlowDefinitionInput!): ApprovalFlowDefinition!
  setDefinitionActive(definitionId: ID!, isActive: Boolean!): ApprovalFlowDefinition!
  start(input: StartApprovalFlowInput!): ApprovalFlowInstance!
  approve(input: ApproveApprovalFlowInput!): ApprovalFlowInstance!
  reject(input: RejectApprovalFlowInput!): ApprovalFlowInstance!
  cancel(input: CancelApprovalFlowInput!): ApprovalFlowInstance!
  processTimeouts: Int!
}

extend type Query {
  approvalFlowInstance(id: ID!): ApprovalFlowInstance
    @hasServerRole(role: SERVER_GUEST)
    @hasScope(scope: "streams:read")
  approvalFlowDefinitions(
    resourceType: ApprovalFlowResourceType
  ): [ApprovalFlowDefinition!]!
    @hasServerRole(role: SERVER_GUEST)
    @hasScope(scope: "streams:read")
  approvalFlowInstances(
    limit: Int = 25
    cursor: String
    status: ApprovalFlowStatus
    scope: ApprovalFlowInstanceListScope = ALL
  ): ApprovalFlowInstanceCollection!
    @hasServerRole(role: SERVER_GUEST)
    @hasScope(scope: "streams:read")
  approvalFlowInstancesByResource(
    resourceType: ApprovalFlowResourceType!
    resourceId: ID!
    limit: Int = 25
    cursor: String
    status: ApprovalFlowStatus
  ): ApprovalFlowInstanceCollection!
    @hasServerRole(role: SERVER_GUEST)
    @hasScope(scope: "streams:read")
  approvalFlowStats(rangeDays: Int = 30): ApprovalFlowStats!
    @hasServerRole(role: SERVER_GUEST)
    @hasScope(scope: "streams:read")
}

extend type Mutation {
  approvalMutations: ApprovalMutations!
    @hasServerRole(role: SERVER_GUEST)
    @hasScope(scope: "streams:write")
}

extend type Subscription {
  approvalFlowTodoCountUpdated: ApprovalFlowTodoCountUpdatedMessage!
    @hasServerRole(role: SERVER_GUEST)
    @hasScope(scope: "streams:read")
}
