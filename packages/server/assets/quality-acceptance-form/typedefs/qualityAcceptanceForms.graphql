type BimElementEntry {
  modelId: ID!
  applicationIds: [String!]!
  bimIds: [String]!
}

input BimElementEntryInput {
  modelId: ID!
  applicationIds: [String!]!
  bimIds: [String]!
}

type QualityAcceptanceForm {
  id: ID!
  name: String
  boqItemId: ID
  boqItem: BoqItem
  code: String
  inspectionLotNumber: String
  acceptancePart: String
  acceptanceContent: String
  actualStartDate: BigInt
  actualFinishDate: BigInt
  inspector: LimitedUser
  inspectorId: ID
  attachments: [BlobMetadata!]!
  processAttachments: [BlobMetadata!]!
  creator: LimitedUser
  creatorId: ID
  projectId: ID
  workVolume: Float
  unit: String
  BIM: [BimElementEntry!]
  BIMelement: [String!] @deprecated(reason: "Use BIM instead")
  timeZone: String
  approveStatus: String
  occupiedMeasurementId: ID
  createdAt: DateTime!
  updatedAt: DateTime!
}

type QualityAcceptanceFormCollection {
  totalCount: Int!
  cursor: String
  items: [QualityAcceptanceForm!]!
}

input ProjectQualityAcceptanceFormsInput {
  search: String
  cursor: String
  limit: Int! = 25
}

input CreateQualityAcceptanceFormInput {
  projectId: ID!
  flowId: ID
  name: String
  boqItemId: ID
  code: String
  inspectionLotNumber: String
  acceptancePart: String
  acceptanceContent: String
  actualStartDate: BigInt
  actualFinishDate: BigInt
  inspector: ID
  attachments: [String!]
  processAttachments: [String!]
  workVolume: Float
  unit: String
  BIM: [BimElementEntryInput!]
  BIMelement: [String!] @deprecated(reason: "Use BIM instead")
  timeZone: String
  approveStatus: String
}

input DeleteQualityAcceptanceFormInput {
  projectId: ID!
  id: ID!
}

input UpdateQualityAcceptanceFormInput {
  projectId: ID!
  id: ID!
  name: String
  boqItemId: ID
  code: String
  inspectionLotNumber: String
  acceptancePart: String
  acceptanceContent: String
  actualStartDate: BigInt
  actualFinishDate: BigInt
  inspector: ID
  attachments: [String!]
  processAttachments: [String!]
  workVolume: Float
  unit: String
  BIM: [BimElementEntryInput!]
  BIMelement: [String!] @deprecated(reason: "Use BIM instead")
  timeZone: String
  approveStatus: String
}

input ImportQualityAcceptanceFormItemInput {
  rowNumber: Int!
  flowId: ID
  name: String
  code: String
  inspectionLotNumber: String
  acceptancePart: String
  acceptanceContent: String
  actualStartDate: BigInt
  actualFinishDate: BigInt
  inspector: ID
  attachments: [String!]
  processAttachments: [String!]
  workVolume: Float
  unit: String
  BIM: [BimElementEntryInput!]
  BIMelement: [String!] @deprecated(reason: "Use BIM instead")
  timeZone: String
  approveStatus: String
}

input ImportQualityAcceptanceFormsInput {
  projectId: ID!
  items: [ImportQualityAcceptanceFormItemInput!]!
}

"""
仅更新附件与过程文件。与 updateForm 不同：查验中/已查验、被月度验工占用的单据
仍允许通过本接口增删附件（业务上需要在验收完成后补传过程文件）。
"""
input UpdateQualityAcceptanceFormAttachmentsInput {
  projectId: ID!
  id: ID!
  attachments: [String!]
  processAttachments: [String!]
}

type QualityAcceptanceImportResult {
  createdCount: Int!
  failedCount: Int!
  failedRows: [String!]!
}

type QualityAcceptanceMutations {
  createForm(input: CreateQualityAcceptanceFormInput!): QualityAcceptanceForm!
  updateForm(input: UpdateQualityAcceptanceFormInput!): QualityAcceptanceForm!
  updateFormAttachments(
    input: UpdateQualityAcceptanceFormAttachmentsInput!
  ): QualityAcceptanceForm!
  deleteForm(input: DeleteQualityAcceptanceFormInput!): Boolean!
  importForms(input: ImportQualityAcceptanceFormsInput!): QualityAcceptanceImportResult!
}

extend type Project {
  qualityAcceptanceForms(
    input: ProjectQualityAcceptanceFormsInput
  ): QualityAcceptanceFormCollection!
}

extend type ProjectMutations {
  qualityAcceptanceMutations: QualityAcceptanceMutations!
}
