type BimElements {
  modelId: ID!
  bimIds: [String!]!
  applicationIds: [String!]!
}

input BimElementsInput {
  modelId: ID!
  bimIds: [String!]!
  applicationIds: [String!]!
}

type QualityAcceptanceForm {
  id: ID!
  name: String
  boqItemId: ID
  code: String
  inspectionLotNumber: String
  acceptancePart: String
  acceptanceContent: String
  actualStartDate: BigInt
  actualFinishDate: BigInt
  inspector: LimitedUser
  inspectorId: ID
  attachments: [BlobMetadata!]!
  creator: LimitedUser
  creatorId: ID
  projectId: ID
  workVolume: Float
  unit: String
  bimElements: BimElements
  BIMelement: [String!] @deprecated(reason: "Use bimElements instead")
  timeZone: String
  approveStatus: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type QualityAcceptanceFormCollection {
  totalCount: Int!
  cursor: String
  items: [QualityAcceptanceForm!]!
}

input ProjectQualityAcceptanceFormsInput {
  search: String
  cursor: String
  limit: Int! = 25
}

input CreateQualityAcceptanceFormInput {
  projectId: ID!
  flowId: ID
  name: String
  boqItemId: ID
  code: String
  inspectionLotNumber: String
  acceptancePart: String
  acceptanceContent: String
  actualStartDate: BigInt
  actualFinishDate: BigInt
  inspector: ID
  attachments: [String!]
  workVolume: Float
  unit: String
  bimElements: BimElementsInput
  BIMelement: [String!] @deprecated(reason: "Use bimElements instead")
  timeZone: String
  approveStatus: String
}

input DeleteQualityAcceptanceFormInput {
  projectId: ID!
  id: ID!
}

input UpdateQualityAcceptanceFormInput {
  projectId: ID!
  id: ID!
  name: String
  boqItemId: ID
  code: String
  inspectionLotNumber: String
  acceptancePart: String
  acceptanceContent: String
  actualStartDate: BigInt
  actualFinishDate: BigInt
  inspector: ID
  attachments: [String!]
  workVolume: Float
  unit: String
  bimElements: BimElementsInput
  BIMelement: [String!] @deprecated(reason: "Use bimElements instead")
  timeZone: String
  approveStatus: String
}

input ImportQualityAcceptanceFormItemInput {
  rowNumber: Int!
  flowId: ID
  name: String
  code: String
  inspectionLotNumber: String
  acceptancePart: String
  acceptanceContent: String
  actualStartDate: BigInt
  actualFinishDate: BigInt
  inspector: ID
  attachments: [String!]
  workVolume: Float
  unit: String
  bimElements: BimElementsInput
  BIMelement: [String!] @deprecated(reason: "Use bimElements instead")
  timeZone: String
  approveStatus: String
}

input ImportQualityAcceptanceFormsInput {
  projectId: ID!
  items: [ImportQualityAcceptanceFormItemInput!]!
}

type QualityAcceptanceImportResult {
  createdCount: Int!
  failedCount: Int!
  failedRows: [String!]!
}

type QualityAcceptanceMutations {
  createForm(input: CreateQualityAcceptanceFormInput!): QualityAcceptanceForm!
  updateForm(input: UpdateQualityAcceptanceFormInput!): QualityAcceptanceForm!
  deleteForm(input: DeleteQualityAcceptanceFormInput!): Boolean!
  importForms(input: ImportQualityAcceptanceFormsInput!): QualityAcceptanceImportResult!
}

extend type Project {
  qualityAcceptanceForms(
    input: ProjectQualityAcceptanceFormsInput
  ): QualityAcceptanceFormCollection!
}

extend type ProjectMutations {
  qualityAcceptanceMutations: QualityAcceptanceMutations!
}
