extend type Project {
  """
  Returns a list models that are being created from a file import
  """
  pendingImportedModels(limit: Int = 25): [FileUpload!]!
}

type FileUploadCollection {
  totalCount: Int!
  cursor: String
  items: [FileUpload!]!
}

input GetModelUploadsInput {
  """
  The maximum number of uploads to return.
  """
  limit: Int = 25
  """
  The cursor for pagination.
  """
  cursor: String
}

extend type Model {
  """
  Returns a list of versions that are being created from a file import
  """
  pendingImportedVersions(limit: Int = 25): [FileUpload!]!

  """
  Get all file uploads ever done in this model
  """
  uploads(input: GetModelUploadsInput): FileUploadCollection!
}

type FileUpload {
  id: String!
  """
  Alias for streamId
  """
  projectId: String!
  """
  Alias for branchName
  """
  modelName: String!
  streamId: String!
  branchName: String!
  """
  If present, the conversion result is stored in this commit.
  """
  convertedCommitId: String
  """
  Alias for convertedCommitId
  """
  convertedVersionId: String
  """
  The user's id that uploaded this file.
  """
  userId: String!
  """
  0 = queued, 1 = processing, 2 = success, 3 = error
  """
  convertedStatus: Int!
  """
  Holds any errors or info.
  """
  convertedMessage: String
  fileName: String!
  fileType: String!
  fileSize: Int!
  uploadComplete: Boolean!
  uploadDate: DateTime!
  convertedLastUpdate: DateTime!
  progressPercent: Int
  progressPhase: String
  progressMessage: String

  """
  Model associated with the file upload, if it exists already
  """
  model: Model
  modelId: String
  """
  Date when upload was last updated
  """
  updatedAt: DateTime!
}

input GenerateFileUploadUrlInput {
  projectId: String!
  fileName: String!
}

type GenerateFileUploadUrlOutput {
  url: String!
  fileId: String!
}

input StartFileImportInput {
  projectId: String!
  modelId: String!

  fileId: String!
  """
  The etag is returned by the blob storage provider in the response body after a successful upload.
  It is used to verify the integrity of the uploaded file.
  """
  etag: String!
}

input CreateMultipartUploadInput {
  projectId: String!
  fileName: String!
}

type CreateMultipartUploadOutput {
  fileId: String!
  uploadId: String!
}

input GetPartUploadUrlInput {
  projectId: String!
  fileId: String!
  uploadId: String!
  partNumber: Int!
}

type GetPartUploadUrlOutput {
  url: String!
  partNumber: Int!
}

input MultipartUploadPartInput {
  partNumber: Int!
  etag: String!
}

input CompleteMultipartUploadInput {
  projectId: String!
  modelId: String!
  fileId: String!
  uploadId: String!
  parts: [MultipartUploadPartInput!]!
}

input AbortMultipartUploadInput {
  projectId: String!
  fileId: String!
  uploadId: String!
}

input ListUploadedPartsInput {
  projectId: String!
  fileId: String!
  uploadId: String!
}

type MultipartUploadPart {
  partNumber: Int!
  etag: String!
  size: Int!
}

type MultipartUploadPartCollection {
  parts: [MultipartUploadPart!]!
}

input FileImportResultInput {
  """
  Total processing time in seconds, since job was picked up until it completed
  """
  durationSeconds: Float!
  """
  Duration of the file download before parsing started in seconds
  """
  downloadDurationSeconds: Float!
  """
  Duration of the transformation in seconds
  """
  parseDurationSeconds: Float!
  """
  Parser used for import
  """
  parser: String!
  """
  Version associated if applicable
  """
  versionId: String
}

enum JobResultStatus {
  success
  error
}

input FinishFileImportInput {
  projectId: String!
  """
  This is the blob Id of the uploaded file. For legacy reasons it is named jobId.
  Note: This is the not the background job Id.
  """
  jobId: String!
  status: JobResultStatus!
  reason: String
  warnings: [String!]
  result: FileImportResultInput!
}

input UpdateFileImportProgressInput {
  projectId: String!
  """
  This is the blob Id of the uploaded file. For legacy reasons it is named jobId.
  Note: This is the not the background job Id.
  """
  jobId: String!
  progressPercent: Int
  progressPhase: String
  progressMessage: String
}

type FileUploadMutations {
  """
  Generate a pre-signed url to which a file can be uploaded.
  After uploading the file, call mutation startFileImport to register the completed upload.
  """
  generateUploadUrl(input: GenerateFileUploadUrlInput!): GenerateFileUploadUrlOutput!
    @hasServerRole(role: SERVER_USER)

  """
  Before calling this mutation, call generateUploadUrl to get the
  pre-signed url and blobId. Then upload the file to that url.
  Once the upload to the pre-signed url is completed, this mutation should be
  called to register the completed upload and create the blob metadata.
  """
  startFileImport(input: StartFileImportInput!): FileUpload!
    @hasServerRole(role: SERVER_USER)

  """
  Create a multipart upload session for resumable file uploads.
  Returns the fileId and the S3 multipart uploadId, which the client must
  retain to upload parts and later complete or abort the upload.
  """
  createMultipartUpload(
    input: CreateMultipartUploadInput!
  ): CreateMultipartUploadOutput!
    @hasServerRole(role: SERVER_USER)

  """
  Generate a pre-signed URL for uploading a single part of a multipart upload.
  """
  getPartUploadUrl(input: GetPartUploadUrlInput!): GetPartUploadUrlOutput!
    @hasServerRole(role: SERVER_USER)

  """
  Complete a multipart upload and start the file import flow.
  The parts must be provided in ascending partNumber order with the ETags
  returned by the object storage after each part upload.
  """
  completeMultipartUpload(input: CompleteMultipartUploadInput!): FileUpload!
    @hasServerRole(role: SERVER_USER)

  """
  Abort an in-progress multipart upload, removing any uploaded parts from storage.
  """
  abortMultipartUpload(input: AbortMultipartUploadInput!): Boolean!
    @hasServerRole(role: SERVER_USER)

  """
  List the parts that have already been uploaded for a multipart upload.
  Used by clients to resume an interrupted upload without re-uploading parts.
  """
  listUploadedParts(input: ListUploadedPartsInput!): MultipartUploadPartCollection!
    @hasServerRole(role: SERVER_USER)

  """
  Marks the file import flow as completed for that specific job
  recording the provided status, and emitting the needed subscriptions.
  Mostly for internal service usage.
  """
  finishFileImport(input: FinishFileImportInput!): Boolean!

  """
  Updates the in-flight progress for a file import job and emits the needed subscriptions.
  Mostly for internal service usage.
  """
  updateFileImportProgress(input: UpdateFileImportProgressInput!): Boolean!
}

extend type Mutation {
  fileUploadMutations: FileUploadMutations!
    @hasScope(scope: "streams:write")
    @hasServerRole(role: SERVER_GUEST)
}

