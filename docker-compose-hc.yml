services:
  postgres:
    image: postgres:16.4-alpine3.20
    restart: always
    environment:
      POSTGRES_DB: speckle
      POSTGRES_USER: speckle
      POSTGRES_PASSWORD: speckle
    volumes:
      - postgres-data:/var/lib/postgresql/data/
      - ./setup/db/10-docker_postgres_init.sql:/docker-entrypoint-initdb.d/10-docker_postgres_init.sql
      - ./setup/db/11-docker_postgres_keycloak_init.sql:/docker-entrypoint-initdb.d/11-docker_postgres_keycloak_init.sql
    command: postgres -c max_prepared_transactions=150

  redis:
    image: 'valkey/valkey:8.1-alpine'
    restart: always
    volumes:
      - redis-data:/data
    ports:
      - '127.0.0.1:3302:6379'

  minio:
    image: 'minio/minio'
    command: server /data --console-address ":9001"
    restart: always
    volumes:
      - minio-data:/data
    ports:
      - '0.0.0.0:3303:9000'
      - '0.0.0.0:3304:9001'

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    depends_on:
      - postgres
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: speckle
      KC_DB_PASSWORD: speckle
      KC_HOSTNAME: 127.0.0.1
      KC_HOSTNAME_PORT: 9000
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_LOG_LEVEL: info
      KC_METRICS_ENABLED: true
      KC_HEALTH_ENABLED: true
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - 3305:8443
      - 3306:9000
      - 3307:8080
    command: start-dev --import-realm
    volumes:
      - ./setup/keycloak:/opt/keycloak/data/import

  maildev:
    restart: always
    image: maildev/maildev
    ports:
      - '127.0.0.1:3308:1080'
      - '127.0.0.1:3309:1025'
  speckle-ingress:
    image: registry.siruijie.com.cn/speckle/speckle-docker-compose-ingress:local
    restart: always
    ports:
      - '0.0.0.0:3300:8080'
    environment:
      FILE_SIZE_LIMIT_MB: '1536'
      NGINX_ENVSUBST_OUTPUT_DIR: '/etc/nginx'
    depends_on:
      - speckle-server
      - speckle-frontend-2

  speckle-frontend-2:
    image: speckle/speckle-frontend-4:29.5
    restart: always
    environment:
      NUXT_PUBLIC_SERVER_NAME: 'local'
      NUXT_PUBLIC_API_ORIGIN: 'http://61.145.255.42:3300'
      NUXT_PUBLIC_BASE_URL: 'http://61.145.255.42:3300'
      NUXT_PUBLIC_BACKEND_API_ORIGIN: 'http://speckle-server:3000'
      NUXT_PUBLIC_LOG_LEVEL: 'warn'
      NUXT_REDIS_URL: 'redis://redis'
      LOG_LEVEL: 'info'
      LOG_PRETTY: 'true'
      NUXT_PUBLIC_FF_LARGE_FILE_IMPORTS_ENABLED: 'true'
      NUXT_PUBLIC_FF_NEXT_GEN_FILE_IMPORTER_ENABLED: 'true'
    depends_on:
      - speckle-server

  speckle-server:
    image: speckle-server:20260429085350
    restart: always
    ports:
      - '0.0.0.0:3301:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "try { require('node:http').request({headers: {'Content-Type': 'application/json'}, port:3000, hostname:'127.0.0.1', path:'/readiness', method: 'GET', timeout: 2000 }, (res) => { body = ''; res.on('data', (chunk) => {body += chunk;}); res.on('end', () => {process.exit(res.statusCode != 200 || body.toLowerCase().includes('error') ? 1 : 0);}); }).end(); } catch { process.exit(1); }"
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 90s
    environment:
      CANONICAL_URL: 'http://61.145.255.42:3300'
      PRIVATE_OBJECTS_SERVER_URL: 'http://speckle-server:3000'
      SESSION_SECRET: 'localdev-session-secret'
      STRATEGY_LOCAL: 'true'
      LOG_LEVEL: 'info'
      LOG_PRETTY: 'true'
      POSTGRES_URL: 'postgres'
      POSTGRES_USER: 'speckle'
      POSTGRES_PASSWORD: 'speckle'
      POSTGRES_DB: 'speckle'
      REDIS_URL: 'redis://redis'
      PREVIEW_SERVICE_USE_PRIVATE_OBJECTS_SERVER_URL: 'true'
      PREVIEW_SERVICE_REDIS_URL: 'redis://redis'
      FILEIMPORT_SERVICE_USE_PRIVATE_OBJECTS_SERVER_URL: 'true'
      FILEIMPORT_SERVICE_REDIS_URL: 'redis://redis'
      S3_ENDPOINT: 'http://minio:9000'
      S3_PUBLIC_ENDPOINT: 'http://61.145.255.42:3303'
      S3_ACCESS_KEY: 'minioadmin'
      S3_SECRET_KEY: 'minioadmin'
      S3_BUCKET: 'speckle-server'
      S3_CREATE_BUCKET: 'true'
      S3_REGION: ''
      FILE_SIZE_LIMIT_MB: 1536
      EMAIL_FROM: 'no-reply@example.org'
      EMAIL_SECURE: 'false'
      EMAIL_REQUIRE_TLS: 'false'
      FRONTEND_ORIGIN: 'http://61.145.255.42:3300'
      ONBOARDING_STREAM_URL: 'https://latest.speckle.systems/projects/843d07eb10'
      FILEIMPORT_QUEUE_POSTGRES_URL: 'postgresql://speckle:speckle@postgres/speckle'
      FF_NEXT_GEN_FILE_IMPORTER_ENABLED: 'true'
      SDUI_URL: 'http://61.145.255.42:3310'
    depends_on:
      - postgres
      - redis
      - minio

  preview-service:
    image: registry.siruijie.com.cn/speckle/speckle-preview-service:local
    restart: always
    mem_limit: '3000m'
    memswap_limit: '3000m'
    environment:
      HOST: '127.0.0.1'
      PORT: '3001'
      LOG_LEVEL: 'info'
      LOG_PRETTY: 'true'
      REDIS_URL: 'redis://redis'
    depends_on:
      - redis

  webhook-service:
    image: registry.siruijie.com.cn/speckle/speckle-webhook-service:local
    restart: always
    environment:
      LOG_LEVEL: 'info'
      LOG_PRETTY: 'true'
      PG_CONNECTION_STRING: 'postgres://speckle:speckle@postgres/speckle'
    depends_on:
      - speckle-server
      - postgres

  ifc-import-server:
    image: registry.siruijie.com.cn/speckle/ifc-import-service:2.26
    restart: always
    environment:
      LOG_LEVEL: 'info'
      LOG_PRETTY: 'true'
      FILEIMPORT_QUEUE_POSTGRES_URL: 'postgresql://speckle:speckle@postgres/speckle'
    depends_on:
      - speckle-server
      - postgres

volumes:
  postgres-data:
  redis-data:
  pgadmin-data:
  minio-data:
