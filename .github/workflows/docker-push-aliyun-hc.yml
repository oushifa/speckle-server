name: Build & Push to Aliyun ACR (hc-server)

# 推送到 hc-server 分支时, 自动编译后端并推送到阿里云 hc 镜像仓库。
# 产物:
#   registry.cn-hangzhou.aliyuncs.com/lengyingxi/hc-speckle-server:<时间戳>
# 时间戳 = 北京时间(Asia/Shanghai)的 YYYYMMDDHHMMSS, 与本机旧脚本命名规则一致。
on:
  push:
    branches: [ hc-server ]

concurrency:
  group: aliyun-build-hc-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  IMAGE_REPO: registry.cn-hangzhou.aliyuncs.com/lengyingxi/hc-speckle-server

jobs:
  build-push-server:
    name: Build & push server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: tag
        name: Generate timestamp tag
        run: |
          TAG="$(TZ='Asia/Shanghai' date +'%Y%m%d%H%M%S')"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "当前版本时间戳: $TAG"

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile.hc
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ steps.tag.outputs.image_tag }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=aliyun-hc-server
          cache-to: type=gha,mode=max,scope=aliyun-hc-server
