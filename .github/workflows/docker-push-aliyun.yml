name: Build & Push to Aliyun ACR

# 推送到 main 时自动编译并推送前后端镜像到阿里云镜像仓库。
# 产物:
#   registry.cn-hangzhou.aliyuncs.com/lengyingxi/speckle-server:server-<时间戳>
#   registry.cn-hangzhou.aliyuncs.com/lengyingxi/speckle-server:frontend-<时间戳>
# 时间戳 = 北京时间(Asia/Shanghai)的 YYYYMMDDHHMMSS, 与本机 build.sh 命名规则一致。
on:
  push:
    branches: [ main ]

# 同一时间只保留最新一次构建:连续 push 时自动取消旧任务, 避免浪费。
concurrency:
  group: aliyun-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  # 阿里云个人版命名空间 lengyingxi 下的 speckle-server 仓库
  IMAGE_REPO: registry.cn-hangzhou.aliyuncs.com/lengyingxi/speckle-server

jobs:
  # 生成一次统一的版本时间戳, 供前后端共用, 保证两个镜像 tag 一致。
  gen-tag:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - id: tag
        run: |
          TAG="$(TZ='Asia/Shanghai' date +'%Y%m%d%H%M%S')"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "当前版本时间戳: $TAG"

  build-push-server:
    name: Build & push server
    needs: gen-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:server-${{ needs.gen-tag.outputs.image_tag }}
          cache-from: type=gha,scope=aliyun-server
          cache-to: type=gha,mode=max,scope=aliyun-server

  build-push-frontend:
    name: Build & push frontend
    needs: gen-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/frontend-2/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:frontend-${{ needs.gen-tag.outputs.image_tag }}
          cache-from: type=gha,scope=aliyun-frontend
          cache-to: type=gha,mode=max,scope=aliyun-frontend
