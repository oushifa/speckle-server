name: Manual Build Server Image

on:
  workflow_dispatch:
    inputs:
      IMAGE_VERSION_TAG:
        description: '镜像版本标签 (例如: manual-latest, 2.18.0)'
        required: true
        default: 'manual-latest'
      REGISTRY_DOMAIN:
        description: '镜像仓库域名'
        required: true
        default: 'ghcr.io'
      REGISTRY_USERNAME:
        description: '镜像仓库用户名 (留空则默认为触发工作流的 GitHub 用户)'
        required: false
        default: ''
      IMAGE_PREFIX:
        description: '镜像命名空间前缀 (留空则默认为 ghcr.io/<当前仓库所有者>)'
        required: false
        default: ''
      PUBLISH_LATEST:
        description: '是否同时标记为 latest 标签'
        type: boolean
        required: false
        default: false
      RUNNER_TYPE:
        description: '执行构建的 Runner 类型'
        required: true
        default: 'ubuntu-latest'

jobs:
  docker-build-server:
    runs-on: ${{ inputs.RUNNER_TYPE }}
    name: Build & Push Server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.REGISTRY_DOMAIN }}
          username: ${{ inputs.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: set-tags
        run: |
          PREFIX="${{ inputs.IMAGE_PREFIX }}"
          if [[ -z "$PREFIX" ]]; then
            PREFIX="ghcr.io/${{ github.repository_owner }}"
          fi
          TAGS="${PREFIX}/speckle-server:${{ inputs.IMAGE_VERSION_TAG }}"
          if [[ "${{ inputs.PUBLISH_LATEST }}" == "true" ]]; then
            TAGS="$TAGS,${PREFIX}/speckle-server:latest"
          fi
          echo "TAGS=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Build and push
        uses: useblacksmith/build-push-action@v2
        with:
          push: true
          tags: ${{ steps.set-tags.outputs.TAGS }}
          file: ./packages/server/Dockerfile
          build-args: |
            SPECKLE_SERVER_VERSION=${{ inputs.IMAGE_VERSION_TAG }}
