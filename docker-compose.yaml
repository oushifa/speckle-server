services:
  # ---------------- Postgres 数据库 ----------------
  postgres:
    image: postgres:16.4-alpine3.20
    restart: always
    environment:
      POSTGRES_DB: speckle
      POSTGRES_USER: speckle
      POSTGRES_PASSWORD: speckle
    volumes:
      - ./data/postgres:/var/lib/postgresql/data/
      - ./setup/db/10-docker_postgres_init.sql:/docker-entrypoint-initdb.d/10-docker_postgres_init.sql
      - ./setup/db/11-docker_postgres_keycloak_init.sql:/docker-entrypoint-initdb.d/11-docker_postgres_keycloak_init.sql
    command: postgres -c max_prepared_transactions=150

  # ---------------- Redis 缓存 ----------------
  redis:
    image: 'valkey/valkey:8.1-alpine'
    restart: always
    volumes:
      - ./data/redis:/data
    ports:
      - '127.0.0.1:6379:6379'

  # ---------------- MinIO 对象存储 ----------------
  minio:
    image: 'minio/minio'
    command: server /data --console-address ":9001"
    restart: always
    volumes:
      - ./data/minio:/data
    ports:
      - '0.0.0.0:9000:9000'
      - '0.0.0.0:9001:9001'

  # ---------------- Keycloak 身份认证 ----------------
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    depends_on:
      - postgres
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: speckle
      KC_DB_PASSWORD: speckle
      KC_HOSTNAME: sznb.shgltz.com
      KC_HOSTNAME_PORT: 443
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: true
      KC_LOG_LEVEL: info
      KC_METRICS_ENABLED: true
      KC_HEALTH_ENABLED: true
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - 8443:8443
      - 9010:9000
      - 8090:8080
    command: start-dev --import-realm
    volumes:
      - ./setup/keycloak:/opt/keycloak/data/import

  # ---------------- Maildev 邮件测试 ----------------
  maildev:
    restart: always
    image: maildev/maildev
    ports:
      - '127.0.0.1:1080:1080'
      - '127.0.0.1:1025:1025'

  # ---------------- Speckle Ingress 入口 ----------------
  speckle-ingress:
    image: registry.siruijie.com.cn/speckle/speckle-docker-compose-ingress:local
    restart: always
    ports:
      - '0.0.0.0:80:8080'
      - '0.0.0.0:443:8443' # 映射宿主机 443 端口到容器内 Nginx 的 HTTPS 端口
    environment:
      FILE_SIZE_LIMIT_MB: '100'
      NGINX_ENVSUBST_OUTPUT_DIR: '/etc/nginx/unused' # 让其默认的模版替换失效，改用我们外挂的纯净 nginx.conf
    depends_on:
      - speckle-server
      - speckle-frontend-2
    volumes:
      - ./ssl:/etc/nginx/ssl:ro # 挂载证书目录到容器中
      - ./nginx.conf:/etc/nginx/nginx.conf:ro # 挂载自定义的 Nginx 核心配置文件

  # ---------------- Speckle 前端 ----------------
  speckle-frontend-2:
    #image: "speckle/speckle-frontend-4:${FRONTEND_TAG}"
    image: 'registry.cn-hangzhou.aliyuncs.com/lengyingxi/speckle-server:${FRONTEND_TAG}'
    restart: always
    environment:
      NUXT_PUBLIC_SERVER_NAME: 'local'
      NUXT_PUBLIC_API_ORIGIN: 'https://sznb.shgltz.com'
      NUXT_PUBLIC_BASE_URL: 'https://sznb.shgltz.com'
      NUXT_PUBLIC_BACKEND_API_ORIGIN: 'http://speckle-server:3000'
      NUXT_PUBLIC_LOG_LEVEL: 'warn'
      NUXT_REDIS_URL: 'redis://redis'
      LOG_LEVEL: 'info'
      LOG_PRETTY: 'true'
      NUXT_PUBLIC_FF_LARGE_FILE_IMPORTS_ENABLED: 'true'
      NUXT_PUBLIC_FF_NEXT_GEN_FILE_IMPORTER_ENABLED: 'true'
      NUXT_PUBLIC_KK_FILE_VIEW_URL: 'http://192.168.160.43:8012'
    depends_on:
      - speckle-server

  # ---------------- Speckle 后端服务器 ----------------
  speckle-server:
    #image: "speckle-server:${SERVER_TAG}"
    image: 'registry.cn-hangzhou.aliyuncs.com/lengyingxi/speckle-server:${SERVER_TAG}'
    restart: always
    ports:
      - '0.0.0.0:3300:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "try { require('node:http').request({headers: {'Content-Type': 'application/json'}, port:3000, hostname:'127.0.0.1', path:'/readiness', method: 'GET', timeout: 2000 }, (res) => { body = ''; res.on('data', (chunk) => {body += chunk;}); res.on('end', () => {process.exit(res.statusCode != 200 || body.toLowerCase().includes('error') ? 1 : 0);}); }).end(); } catch { process.exit(1); }"
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 90s
    environment:
      CANONICAL_URL: 'https://sznb.shgltz.com'
      PRIVATE_OBJECTS_SERVER_URL: 'http://speckle-server:3000'
      SESSION_SECRET: 'localdev-session-secret'
      STRATEGY_LOCAL: 'true'
      LOG_LEVEL: 'info'
      LOG_PRETTY: 'true'
      POSTGRES_URL: 'postgres'
      POSTGRES_USER: 'speckle'
      POSTGRES_PASSWORD: 'speckle'
      POSTGRES_DB: 'speckle'
      REDIS_URL: 'redis://redis'
      PREVIEW_SERVICE_USE_PRIVATE_OBJECTS_SERVER_URL: 'true'
      PREVIEW_SERVICE_REDIS_URL: 'redis://redis'
      FILEIMPORT_SERVICE_USE_PRIVATE_OBJECTS_SERVER_URL: 'true'
      FILEIMPORT_SERVICE_REDIS_URL: 'redis://redis'
      S3_ENDPOINT: 'http://minio:9000'
      S3_PUBLIC_ENDPOINT: 'https://sznb.shgltz.com:9000' # 如 MinIO 外部需用单独端口，此处需同步注意
      S3_ACCESS_KEY: 'minioadmin'
      S3_SECRET_KEY: 'minioadmin'
      S3_BUCKET: 'speckle-server'
      S3_CREATE_BUCKET: 'true'
      S3_REGION: ''
      FILE_SIZE_LIMIT_MB: 1000
      EMAIL_FROM: 'no-reply@example.org'
      EMAIL_SECURE: 'false'
      EMAIL_REQUIRE_TLS: 'false'
      FRONTEND_ORIGIN: 'https://sznb.shgltz.com'
      ONBOARDING_STREAM_URL: 'https://latest.speckle.systems/projects/843d07eb10'
      FILEIMPORT_QUEUE_POSTGRES_URL: 'postgresql://speckle:speckle@postgres/speckle'
      FF_NEXT_GEN_FILE_IMPORTER_ENABLED: 'true'
      SDUI_URL: 'http://192.168.160.43:8082'
      BUDGET_API_BASE_URL: 'https://yct.shgltz.com'
      BUDGET_API_TOKEN: 'aebff284001011f192ae00163e28a761'
      EXTERNAL_API_TOKEN: 'srj-external-api'
      SPECKLE_SERVER_URL: 'https://sznb.shgltz.com'

    depends_on:
      - postgres
      - redis
      - minio

  # ---------------- 预览服务 ----------------
  preview-service:
    image: registry.siruijie.com.cn/speckle/speckle-preview-service:local
    restart: always
    mem_limit: '3000m'
    memswap_limit: '3000m'
    environment:
      HOST: '127.0.0.1'
      PORT: '3001'
      LOG_LEVEL: 'info'
      LOG_PRETTY: 'true'
      REDIS_URL: 'redis://redis'
    depends_on:
      - redis

  # ---------------- Webhook 服务 ----------------
  webhook-service:
    image: registry.siruijie.com.cn/speckle/speckle-webhook-service:local
    restart: always
    environment:
      LOG_LEVEL: 'info'
      LOG_PRETTY: 'true'
      PG_CONNECTION_STRING: 'postgres://speckle:speckle@postgres/speckle'
    depends_on:
      - speckle-server
      - postgres

  # ---------------- IFC 导入服务 ----------------
  ifc-import-server:
    #image: registry.siruijie.com.cn/speckle/ifc-import-service:2.26
    image: registry.cn-hangzhou.aliyuncs.com/lengyingxi/hc-speckle-server:ifc-20260911214202
    restart: always
    environment:
      LOG_LEVEL: 'info'
      LOG_PRETTY: 'true'
      FILEIMPORT_QUEUE_POSTGRES_URL: 'postgresql://speckle:speckle@postgres/speckle'
    depends_on:
      - speckle-server
      - postgres

  # ---------------- DXF 导入服务 ----------------
  dxf-import-server:
    image: registry.siruijie.com.cn/weidongjie/dxf/dxf:v1
    restart: always
    container_name: speckle-server-dxf
    environment:
      LOG_LEVEL: 'info'
      LOG_PRETTY: 'true'
      FILEIMPORT_QUEUE_POSTGRES_URL: 'postgresql://speckle:speckle@postgres/speckle'
    depends_on:
      - speckle-server
      - postgres
